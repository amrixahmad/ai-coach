[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "libGL", "libGLU", "glib", "xorg.libX11", "xorg.libXext", "xorg.libXrender", "xorg.libSM", "xorg.libICE"]

[phases.install]
cmds = ["python -m venv /opt/venv", "/opt/venv/bin/pip install -r requirements.txt"]

[variables]
PATH = "/opt/venv/bin:${PATH}"

[start]
cmd = "/opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port $PORT"
