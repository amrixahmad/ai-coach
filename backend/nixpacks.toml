[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "libGL", "libGLU", "mesa", "glib", "glib.out", "stdenv.cc.cc.lib", "zlib", "xorg.libX11", "xorg.libXext", "xorg.libXrender", "xorg.libSM", "xorg.libICE"]

[phases.install]
cmds = ["python -m venv /opt/venv", "/opt/venv/bin/pip install -r requirements.txt"]

[variables]
PATH = "/opt/venv/bin:${PATH}"
LD_LIBRARY_PATH = "/root/.nix-profile/lib:/root/.nix-profile/lib64:${LD_LIBRARY_PATH}"

[start]
cmd = "LD_LIBRARY_PATH=/root/.nix-profile/lib:/root/.nix-profile/lib64:$LD_LIBRARY_PATH /opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port $PORT"
